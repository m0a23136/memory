<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>思い出アルバム</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
 </head>

<body>
<div id="cameraPage">
  <h1>アルバム</h1>

  <div class="camera-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <button id="switchCameraBtn">
      カメラ切替
    </button>

    <button id="captureBtn">撮影して保存</button>

  </div>

  <button class="link-btn" id="openAlbum">アルバムを開く</button>
  <button class="link-btn" id="openMap">マップを見る</button>

</div>

<div id="albumPage" style="display:none;">


 <h2>撮影した写真</h2>

 <div class="search-box">
    <input
        type="text"
        id="searchInput"
        placeholder="メモを検索">
</div>


<div class="gallery" id="gallery"></div>

 <button id="backCamera">
    カメラへ戻る
 </button>

</div>

<div id="mapPage" style="display:none;">
  <h2>マップ</h2>

  <div id="map"></div>

  <div id="mapPhotoList"></div>

  <div id="mapPhotoList"></div>

  <button id="backCameraFromMap">
    カメラへ戻る
  </button>

</div>


<script src="common.js"></script>
<script src="camera.js"></script>
<script src="album.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js"></script>

</body>
</html>
